<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CompraDona</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CompraDona">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<div id="welcome" class="welcome"><div class="loading">Un momentito…</div></div>
<div id="main" hidden>
  <header class="hdr">
    <div class="tt"><h1>Compra<span>Dona</span></h1><small>Pa la tetita de Noah</small></div>
    <button id="count" class="count" aria-label="Actualizar"></button>
    <span id="sync" class="sync ok"></span>
  </header>
  <div id="favs" class="favs" hidden></div>
  <main id="list" class="list"></main>
  <div class="dock">
    <div id="sugs" class="sugs"></div>
    <div class="dockrow">
    <button id="undo" class="undo off" type="button" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <form id="addf" class="addf" autocomplete="off">
      <svg id="guess" class="guess" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input id="inp" placeholder="Añade… 2 leche, pan" enterkeyhint="done" autocapitalize="sentences">
      <button class="addb" aria-label="Añadir"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    </div>
  </div>
</div>
<div id="layer"></div>
<script src="../config.js?v=1"></script>
<script src="../src/google.js?v=2"></script>
<script src="app.js?v=12"></script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){
  var c0=navigator.serviceWorker.controller, hadSW=!!(c0&&/\/compra\/sw\.js/.test(c0.scriptURL));
  navigator.serviceWorker.register('sw.js').then(function(r){ r.update(); document.addEventListener('visibilitychange',function(){ if(!document.hidden) r.update(); }); });
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadSW||document.getElementById('upd')) return;
    var b=document.createElement('button'); b.id='upd'; b.className='updbar'; b.textContent='Versión nueva lista · Toca para actualizar';
    b.onclick=function(){ location.reload(); }; document.body.appendChild(b);
  });
}
</script>
</body>
</html>
